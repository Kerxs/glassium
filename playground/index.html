<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glassium · 网页上的液态玻璃</title>
    <meta
      name="description"
      content="Liquid Glass（液态玻璃）的 Web 渲染运行时：import 'glassium' 之后写 <div glass> 就是玻璃 —— 折射、色散、亮边、按下的光都由 GPU 实时绘制。"
    />
    <link rel="stylesheet" href="./site.css" />
    <!--
      Glassium 的站点：一个页面、顶部一条玻璃导航，五个标签（概览 / 控件 / 设备 / 材质 / 开发者），地址带 #标签。
      每个标签的正文是下面的一个 <template>，第一次进入时克隆成 <section data-tab="…">；同一时间只有当前标签的
      section 在文档里 —— 切走的标签不参与渲染（组件与 runtime 自己注销玻璃），切回来时元素与状态原样挂回去。
      整页只有一个 stage（runtime 建的），每个标签显示时换上自己的场景。路由与生命周期在 site.ts，各标签的交互在 tabs/。
    -->
  </head>
  <body>
    <header class="site-top" glass>
      <a class="site-brand" href="#overview">Glassium</a>
      <nav class="site-tabs" aria-label="页面">
        <a href="#overview" data-tab-link="overview">概览</a>
        <a href="#controls" data-tab-link="controls">控件</a>
        <a href="#devices" data-tab-link="devices">设备</a>
        <a href="#editor" data-tab-link="editor">材质</a>
        <a href="#dev" data-tab-link="dev">开发者</a>
      </nav>
      <a class="site-gh" href="https://github.com/Kerxs/glassium">GitHub</a>
    </header>

    <main id="site-main"></main>

    <noscript><p class="site-noscript">这个站点要用 JavaScript 才能显示。</p></noscript>

    <template id="tab-overview">
      <div class="tab-main">
        <section class="hero">
          <h1>写一个属性，就是玻璃</h1>
          <p class="lede">这一页只有 <code>import 'glassium'</code> 与 <code>glass</code> 属性。后端、质量、背景都是 runtime 自己定的。</p>
          <div class="card" glass>
            <h2>&lt;div glass&gt;</h2>
            <p>Default Glass：模糊、折射、色散、亮边、投影。背后的渐变被弯过来。</p>
            <button glass>按一下</button>
          </div>
        </section>

        <section class="grid">
          <div class="tile tile-photo">
            <div class="badge" glass="tinted">tinted</div>
          </div>
          <div class="tile tile-mint">
            <div class="badge" glass="frosted">frosted</div>
          </div>
          <div class="tile tile-night">
            <div class="badge" glass="clear" glass-dispersion="0.3">clear · 色散 0.3</div>
          </div>
        </section>

        <section class="content" id="content">
          <h2>玻璃后面的内容也被折射</h2>
          <p class="article">
            这一段是普通的 DOM 文字，里面有<mark>高亮</mark>、<a href="#content">链接</a>与 <strong>粗体</strong>。
            把鼠标移到这一块上，玻璃透镜跟着走：它后面的文字、图片、画布动画、视频都被 runtime 画进场景（DOM Renderer），
            玻璃把它们模糊、弯折、放大。离开玻璃的内容照旧由浏览器画，选中、链接、读屏都不受影响。
          </p>
          <div class="media">
            <img src="./assets/runtime-hills.svg" alt="黄昏的山丘" width="240" height="150" />
            <canvas id="spin" width="240" height="150" aria-label="转动的色环"></canvas>
            <video id="clip" width="240" height="150" muted playsinline aria-label="由画布生成的视频"></video>
          </div>
          <div class="lens" glass="clear" glass-refraction="0.45" glass-magnify="0.25" glass-jelly aria-hidden="true"></div>
        </section>

        <section class="motion" id="motion">
          <h2>动起来的玻璃</h2>
          <p class="lede">
            <code>glass-jelly</code>：元素怎么动的都行（拖、过渡、JS），玻璃顺着速度拉长、停下圆回去；
            <code>glass-glide</code>：元素一下子换了位置，玻璃抬起、飞过去、落下。只动玻璃，里面的字不变形。
          </p>
          <div class="pad" id="pad">
            <div class="puck" glass glass-jelly tabindex="0" role="button" aria-label="可拖动的玻璃">拖我</div>
          </div>
          <div class="tabs" role="tablist" id="tabs">
            <div class="pill" glass glass-glide glass-jelly aria-hidden="true"></div>
            <button type="button" role="tab" aria-selected="true">今天</button>
            <button type="button" role="tab" aria-selected="false">本周</button>
            <button type="button" role="tab" aria-selected="false">本月</button>
            <button type="button" role="tab" aria-selected="false">全年</button>
          </div>
          <div class="morph-row">
            <button type="button" class="chip" id="chip" glass>展开</button>
            <div class="sheet" id="sheet" glass="frosted">
              <strong>一块变成另一块</strong>
              <p><code>glassium.morph(from, to)</code>：形状、圆角、材质一起过渡。</p>
              <button type="button" id="collapse" glass>收起</button>
            </div>
          </div>
        </section>

        <section class="controls">
          <label>质量
            <select id="quality">
              <option value="auto">auto（自适应）</option>
              <option value="high">high</option>
              <option value="medium">medium</option>
              <option value="low">low</option>
            </select>
          </label>
          <button type="button" id="open-debug" glass>调试面板</button>
          <p id="caps" class="caps"></p>
        </section>

      </div>
    </template>
    <template id="tab-controls">
      <div class="tab-main">
        <section class="intro">
          <h1>组件：开关、滑块、分段、标签栏</h1>
          <p class="lede">
            液态玻璃（Liquid Glass）的 Web 实现。下面四块屏幕里的控件都是真的：拖一拖滑块、按住分段控件的选中块、
            在标签栏上按住左右拖 —— 透镜、折射、亮边都由 GPU 实时画。
          </p>
          <pre class="install"><code>npm install glassium</code></pre>
        </section>

        <div class="scenes">
          <!-- 1 设置（浅色） -->
          <section class="scene" aria-labelledby="t-settings">
            <header class="scene-text-block">
              <h2 id="t-settings">设置</h2>
              <p>白底上的玻璃：旋钮平时是白色的胶囊，一按住就变成透明的透镜，边缘一圈淡灰的外线。</p>
              <ul class="try">
                <li>按住亮度滑块的旋钮左右拖：透镜顺着速度拉长，停下来慢慢圆回去</li>
                <li>按住「外观」的选中块拖到别的段上</li>
              </ul>
            </header>
            <div class="slot">
              <div class="screen light" id="s-settings">
                <glass-fill class="wall" style="--glass-fill: #f2f2f7"></glass-fill>
                <div class="st-nav"><span class="st-back">‹ 设置</span><span class="st-title">显示与亮度</span></div>
                <p class="st-head">外观</p>
                <glass-fill class="group">
                  <div class="row">
                    <span>外观</span>
                    <glass-segmented class="st-seg" value="light" aria-label="外观">
                      <span value="light">浅色</span>
                      <span value="dark">深色</span>
                      <span value="auto">自动</span>
                    </glass-segmented>
                  </div>
                </glass-fill>
                <p class="st-head">亮度</p>
                <glass-fill class="group">
                  <div class="row bright">
                    <span class="ico sm" data-icon="sun"></span>
                    <glass-slider class="st-slider" value="55" aria-label="亮度"></glass-slider>
                    <span class="ico lg" data-icon="sun"></span>
                  </div>
                  <glass-fill class="sep"></glass-fill>
                  <div class="row">
                    <span>原彩显示</span>
                    <glass-switch checked aria-label="原彩显示"></glass-switch>
                  </div>
                </glass-fill>
                <p class="st-note">根据环境光自动调整屏幕，让色彩在不同环境下看起来一致。</p>
                <glass-fill class="group">
                  <div class="row">
                    <span>自动锁定</span>
                    <glass-switch aria-label="自动锁定"></glass-switch>
                  </div>
                  <glass-fill class="sep"></glass-fill>
                  <div class="row">
                    <span>抬起唤醒</span>
                    <glass-switch checked aria-label="抬起唤醒"></glass-switch>
                  </div>
                </glass-fill>
                <p class="st-head">文字</p>
                <glass-fill class="group">
                  <div class="row bright">
                    <span class="st-a sm" aria-hidden="true">A</span>
                    <glass-slider class="st-slider" value="40" aria-label="文字大小"></glass-slider>
                    <span class="st-a lg" aria-hidden="true">A</span>
                  </div>
                  <glass-fill class="sep"></glass-fill>
                  <div class="row">
                    <span>粗体文本</span>
                    <glass-switch aria-label="粗体文本"></glass-switch>
                  </div>
                </glass-fill>
              </div>
            </div>
          </section>

          <!-- 2 控制中心（深色） -->
          <section class="scene" aria-labelledby="t-cc">
            <header class="scene-text-block">
              <h2 id="t-cc">控制中心</h2>
              <p>暗底上的玻璃：亮边明亮，还带着底下内容的颜色；按下时从手指处亮起来。</p>
              <ul class="try">
                <li>点连接模块里的圆按钮开关它们</li>
                <li>在亮度、音量两块上下拖</li>
              </ul>
            </header>
            <div class="slot">
              <div class="screen dark" id="s-cc">
                <glass-fill class="wall" style="--glass-fill: linear-gradient(160deg, #20242e, #2a2033 55%, #1b2427)"></glass-fill>
                <glass-fill class="blob" style="left: -30px; top: 90px; width: 260px; height: 260px; --glass-fill: radial-gradient(circle, rgba(58, 132, 255, 0.85), rgba(58, 132, 255, 0))"></glass-fill>
                <glass-fill class="blob" style="left: 190px; top: 60px; width: 240px; height: 240px; --glass-fill: radial-gradient(circle, rgba(255, 150, 60, 0.7), rgba(255, 150, 60, 0))"></glass-fill>
                <glass-fill class="blob" style="left: 150px; top: 330px; width: 220px; height: 220px; --glass-fill: radial-gradient(circle, rgba(255, 70, 110, 0.6), rgba(255, 70, 110, 0))"></glass-fill>
                <glass-fill class="blob" style="left: -20px; top: 470px; width: 260px; height: 260px; --glass-fill: radial-gradient(circle, rgba(60, 200, 120, 0.55), rgba(60, 200, 120, 0))"></glass-fill>
                <div class="cc-status"><span>5G</span><span>71%</span></div>
                <div class="cc-grid">
                  <glass-card class="cc-module conn" corner-radius="32">
                    <glass-button class="cc-round" type="button" data-toggle aria-pressed="false" aria-label="飞行模式"><span data-icon="airplane"></span></glass-button>
                    <glass-button class="cc-round" type="button" data-toggle aria-pressed="true" aria-label="隔空投送"><span data-icon="rings"></span></glass-button>
                    <glass-button class="cc-round" type="button" data-toggle aria-pressed="true" aria-label="无线局域网"><span data-icon="wifi"></span></glass-button>
                    <glass-button class="cc-round" type="button" data-toggle aria-pressed="true" aria-label="蓝牙"><span data-icon="bluetooth"></span></glass-button>
                  </glass-card>
                  <glass-card class="cc-module media" corner-radius="32">
                    <p class="media-title" id="cc-title">未在播放</p>
                    <div class="media-controls">
                      <glass-button class="media-btn" type="button" aria-label="上一首"><span data-icon="prev"></span></glass-button>
                      <glass-button class="media-btn" type="button" id="cc-play" aria-label="播放"><span data-icon="play"></span></glass-button>
                      <glass-button class="media-btn" type="button" aria-label="下一首"><span data-icon="next"></span></glass-button>
                    </div>
                  </glass-card>
                  <glass-button class="cc-tile" type="button" data-toggle data-light aria-pressed="true" aria-label="屏幕方向锁定"><span data-icon="lock"></span></glass-button>
                  <glass-button class="cc-tile" type="button" data-toggle data-light aria-pressed="false" aria-label="手电筒"><span data-icon="flashlight"></span></glass-button>
                  <glass-card class="vslider" id="cc-bright" corner-radius="1frac" role="slider" aria-label="亮度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="55" tabindex="0">
                    <glass-fill class="level" style="--glass-fill: rgba(255, 255, 255, 0.92)"></glass-fill>
                    <span class="vslider-ico" data-icon="sun"></span>
                  </glass-card>
                  <glass-card class="vslider" id="cc-volume" corner-radius="1frac" role="slider" aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30" tabindex="0">
                    <glass-fill class="level" style="--glass-fill: rgba(255, 255, 255, 0.92)"></glass-fill>
                    <span class="vslider-ico" data-icon="speaker"></span>
                  </glass-card>
                  <glass-button class="cc-focus" type="button" data-toggle aria-pressed="false"><span data-icon="moon"></span>专注模式</glass-button>
                  <glass-button class="cc-focus" type="button" data-toggle aria-pressed="false"><span data-icon="mirror"></span>屏幕镜像</glass-button>
                  <glass-button class="cc-focus" type="button" data-toggle aria-pressed="false"><span data-icon="home"></span>家庭</glass-button>
                  <div class="cc-row">
                    <glass-button class="cc-round small" type="button" aria-label="计时器"><span data-icon="timer"></span></glass-button>
                    <glass-button class="cc-round small" type="button" aria-label="相机"><span data-icon="camera"></span></glass-button>
                    <glass-button class="cc-round small" type="button" data-toggle aria-pressed="false" aria-label="录屏"><span data-icon="rings"></span></glass-button>
                    <glass-button class="cc-round small" type="button" aria-label="计算器"><span data-icon="calculator"></span></glass-button>
                  </div>
                  <div class="cc-row">
                    <glass-button class="cc-round small" type="button" data-toggle aria-pressed="false" aria-label="静音"><span data-icon="bell"></span></glass-button>
                    <glass-button class="cc-round small" type="button" data-toggle aria-pressed="true" aria-label="深色外观"><span data-icon="contrast"></span></glass-button>
                    <glass-button class="cc-round small" type="button" aria-label="钱包"><span data-icon="wallet"></span></glass-button>
                    <glass-button class="cc-round small" type="button" data-toggle aria-pressed="false" aria-label="低电量模式"><span data-icon="battery"></span></glass-button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- 3 应用列表 + 标签栏（浅色） -->
          <section class="scene" aria-labelledby="t-store">
            <header class="scene-text-block">
              <h2 id="t-store">标签栏</h2>
              <p>长按选中的那一格，它变成比栏还高的透镜，把底下的图标、文字放大；拖动时顺着速度拉长，透镜里的都换成选中色。</p>
              <ul class="try">
                <li>在「Today」上按住，往右拖到「App」</li>
                <li>上下滚动列表：内容从玻璃栏底下滑过，标题被折射</li>
              </ul>
            </header>
            <div class="slot">
              <div class="screen light" id="s-store">
                <glass-fill class="wall" style="--glass-fill: #ffffff"></glass-fill>
                <div class="store-scroll" id="store-scroll">
                  <p class="store-date" id="store-date"></p>
                  <h3 class="store-title scene-text">Today</h3>
                  <glass-fill class="feature" style="--glass-fill: linear-gradient(140deg, #ffb340, #ff5e62 55%, #c644fc)">
                    <p class="feature-kicker">精选</p>
                    <p class="feature-title">玻璃的十个小技巧</p>
                  </glass-fill>
                  <h4 class="store-head scene-text">为你推荐</h4>
                  <div class="apps" id="store-apps"></div>
                  <h4 class="store-head scene-text">Essential games</h4>
                  <div class="apps" id="store-games"></div>
                </div>
                <glass-tab-bar class="store-tabs" value="today" aria-label="应用商店">
                  <button value="today"><span class="tab-ico" data-icon="today"></span><span>Today</span></button>
                  <button value="games"><span class="tab-ico" data-icon="gamepad"></span><span>游戏</span></button>
                  <button value="apps"><span class="tab-ico" data-icon="layers"></span><span>App</span></button>
                  <button value="search"><span class="tab-ico" data-icon="search"></span><span>搜索</span></button>
                </glass-tab-bar>
              </div>
            </div>
          </section>

          <!-- 4 锁屏（深色） -->
          <section class="scene" aria-labelledby="t-lock">
            <header class="scene-text-block">
              <h2 id="t-lock">锁屏</h2>
              <p>壁纸上的圆形玻璃按钮与通知：清透，只有一圈亮边和一点折射，看得见后面的丝带。</p>
              <ul class="try">
                <li>点左下角的手电筒，再点一下关掉</li>
                <li>按住右下角的相机：按下的地方亮起来</li>
              </ul>
            </header>
            <div class="slot">
              <div class="screen dark" id="s-lock">
                <div class="wall" id="lock-wall"></div>
                <p class="lock-date" id="lock-date"></p>
                <p class="lock-time" id="lock-time"></p>
                <glass-card class="notif" corner-radius="26" preset="regular">
                  <glass-fill class="notif-ico"><span data-icon="sparkle"></span></glass-fill>
                  <span class="notif-body"><strong>Glassium</strong><span>透镜、亮边、果冻，都在 GPU 上画。</span></span>
                  <span class="notif-time">刚刚</span>
                </glass-card>
                <glass-button class="lock-btn left" type="button" data-toggle data-light aria-pressed="false" aria-label="手电筒"><span data-icon="flashlight"></span></glass-button>
                <glass-button class="lock-btn right" type="button" aria-label="相机"><span data-icon="camera"></span></glass-button>
              </div>
            </div>
          </section>
        </div>

      </div>
      <footer class="fine">
      <p>
        玻璃折射的是 Glassium 自己画的场景（壁纸、分组、图块、标题都是画进场景的填充），不是它背后的网页 DOM ——
        原理和限制见 <a href="https://github.com/Kerxs/glassium/blob/main/docs/limitations.md">limitations.md</a>。
      </p>
      <p>这些界面是为演示液态玻璃画的示意，图形都是自己画的，与 Apple 无关。iPhone 是 Apple Inc. 的商标。</p>
      </footer>
    </template>
    <template id="tab-devices">
      <div class="tab-main">
        <section class="showcase showcase-phone" aria-labelledby="phone-title">
          <header class="intro">
            <h1>液态玻璃，画在网页里</h1>
            <p class="lede">
              下面这台 iPhone 和这台 Mac 的界面里，每一块玻璃都是 GPU 实时画的：边缘把背后的壁纸和照片弯过来，
              色散、亮边、按下去的光，都跟着网页的 DOM 走。它们都能点。
            </p>
          </header>
          <div class="copy">
            <h2 id="phone-title">iPhone</h2>
            <p>
              主屏幕的图标、小组件、Dock 都是清透的玻璃，壁纸是画进场景的 <code>&lt;glass-fill&gt;</code>。
              边缘那一圈把壁纸上的圆环和条纹弯了过来 —— 这是真的折射，不是模糊。
            </p>
            <ul class="try">
              <li>点「照片」：照片在玻璃标签栏底下滚动，按钮里的「选择」会分出水滴</li>
              <li>点右上角的电池：拉下控制中心，开关、滑块都能用</li>
              <li>按住任何一颗玻璃按钮：光从按下的地方亮起来</li>
            </ul>
          </div>

          <div class="slot" data-slot="phone">
            <div class="iphone" id="iphone" role="group" aria-label="iPhone 演示" data-screen="home">
              <span class="side-btn action" aria-hidden="true"></span>
              <span class="side-btn vol-up" aria-hidden="true"></span>
              <span class="side-btn vol-down" aria-hidden="true"></span>
              <span class="side-btn power" aria-hidden="true"></span>

              <!-- 壁纸：几块填充叠出来，比屏幕大一圈、伸到边框底下（边框是 DOM，盖住多出来的那圈），
                   屏幕边上的玻璃往外折射时采到的也是壁纸 -->
              <div class="wall" aria-hidden="true">
                <glass-fill style="left: 0; top: 0; width: 100%; height: 100%; --glass-fill: linear-gradient(165deg, #1b2c70 0%, #3a2a7c 40%, #151745 72%, #0a0c26 100%)"></glass-fill>
                <glass-fill style="left: -70px; top: 150px; width: 380px; height: 380px; border-radius: 50%; --glass-fill: radial-gradient(circle at 38% 36%, #ffd29a 0%, #ff8a5c 36%, #ff4f7b 68%, #9b2c7a 100%)"></glass-fill>
                <glass-fill style="left: 196px; top: 450px; width: 300px; height: 300px; border-radius: 50%; --glass-fill: radial-gradient(circle at 34% 32%, #a5f3ff 0%, #3aa6ff 48%, #2b45c9 100%)"></glass-fill>

            折射深度、位移幅度是短边的比例 —— 换了尺寸，看起来也会变。完整的属性见
            <a href="https://github.com/Kerxs/glassium/blob/main/docs/api.md">docs/api.md</a>。
          </p>
