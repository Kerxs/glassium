name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动重跑一次（比如只想重新部署 playground）
  workflow_dispatch:

# 默认只读；要写 Pages 的只有下面的 pages job，它自己声明
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # meshora 用 Node 22，这里用 24，是有硬理由的：测试直接跑带类型标注的
      # .ts，靠的是 Node 原生类型擦除。22 上跑不了，而为此引入一个测试框架
      # 就是给零依赖的库加依赖。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 类型门禁
        run: npm run typecheck

      - name: CPU 测试
        run: npm test

      # 类型门禁不管打包目标：顶层 await 在 Vite 默认的 es2020 目标下构建直接失败，
      # 开发服务器却照样能跑 —— 只有真的构建一次才暴露（demo.ts 就这样漏过一次）。
      # 构建出来的 playground/dist 也就是 main 上部署到 GitHub Pages 的那一份。
      - name: 构建
        run: npm run build

      # 要发布的包里有什么：入口、类型、兜底样式、许可声明都在，测试与源码不在，
      # package.json 的 exports 指向的文件真的在包里（npm ci 已经经 prepare 构建过 dist/）
      - name: 打包内容
        run: node scripts/check-pack.ts

      # 改了光学却没跑 gen:conformance 的话，签入的向量就和实现漂了，
      # 而那份向量是未来 Android / iOS 渲染器唯一的契约。
      - name: 符合性向量同一性
        run: |
          npm run gen:conformance
          git diff --exit-code -- spec/conformance/

      # 同理：改了 WGSL 却没跑 gen:glsl 的话，签入的 GLSL 就和真源漂了。
      # WGSL 是唯一真源，GLSL 是机械生成物 —— 两边手动各改一次迟早会分叉，
      # 而分叉的表现是「WebGPU 下好的、WebGL2 下微妙地不对」，最难查的那一类。
      - name: GLSL 重生成同一性
        run: |
          npm run gen:glsl
          git diff --exit-code -- src/shaders/generated/

      # 走到这里，上面的检查都过了：main 上的这次构建交给 Pages（部署在下面的 pages job）。
      # PR 不部署。
      - name: Playground 交给 Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

      # 这个 job 不覆盖 GPU 输出。绿色徽章只代表数学和类型是对的，
      # 不代表像素是对的 —— 像素由 playground/verify.html 手工验证。
      # 详见 spec/golden/README.md。

  # 把 check 交上来的 playground 部署到 https://kerxs.github.io/glassium/ 。
  # 仓库的 Pages 设置里来源选的是「GitHub Actions」。
  pages:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # 连着推几次时按顺序一个个部署，不打断正在进行的那次
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
